name: 產生早報

on:
  schedule:
    # GitHub 用 UTC。台灣時間 = UTC+8，週一到週五
    - cron: '30 23 * * 0-4'   # 07:30 早報
    - cron: '0 4 * * 1-5'     # 12:00
    - cron: '0 6 * * 1-5'     # 14:00 台股收盤後
    - cron: '0 14 * * 1-5'    # 22:00 美股開盤前後
  # 雲端排程用你的 Claude 帳號寫好 AI 摘要並推上來時，重新產生早報並寄 Email
  push:
    branches: [main]
    paths: ['site/data/ai_summary.json']
  workflow_dispatch:
    inputs:
      notify:
        description: '這次要寄 Email 嗎？'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 產生早報
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
          SITE_URL: ${{ vars.SITE_URL }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.notify }}" = "true" ]; then
            python -m briefing --notify
          else
            python -m briefing
          fi

      - name: 存回 repo（保留歷史早報）
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "早報 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
