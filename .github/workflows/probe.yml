# 暫時：用真實資料驗證資料日期修正（合併前會刪除）
name: probe
on:
  push:
    branches: [claude/project-thread-qrr17z]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: 比較批次下載與修正後的結果
        run: |
          python - <<'PY'
          import logging, yfinance as yf
          logging.basicConfig(level=logging.INFO, format="%(levelname)s %(message)s")
          from briefing import config
          from briefing.market import _history, twse_taiex
          items = [config.TAIEX, *config.GLOBAL_INDICES, *config.AI_STOCKS, config.AI_BENCHMARK, *config.GAUGES]
          syms = [i["symbol"] for i in items]
          df = yf.download(syms, period="13mo", interval="1d", auto_adjust=False, group_by="ticker", progress=False, threads=True)
          raw = {}
          for s in syms:
              try:
                  c = df[s]["Close"].dropna(); raw[s] = (c.index[-1].strftime("%Y-%m-%d"), round(float(c.values[-1]), 2))
              except Exception as e:
                  raw[s] = ("ERR", str(e)[:40])
          fixed = _history(syms)
          for s in syms:
              f = fixed.get(s)
              print(f"{s:10} batch={raw[s]} fixed={(f[0][-1], round(f[1][-1], 2)) if f else None}")
          t = twse_taiex()
          print("TWSE", t and list(zip(t[0][-3:], t[1][-3:])))
          PY
      - name: 完整產生一次早報（不寫回 repo）
        run: |
          python -m briefing --out site/data
          python - <<'PY'
          import json
          d = json.load(open("site/data/latest.json")); m = d["market"]
          t = m["taiex"]; print("TAIEX", t.get("as_of"), t.get("last"), t.get("change_pct"), t.get("stale"), t.get("kept_previous"))
          for k in ("global", "gauges"):
              for q in m[k]: print(k, q["symbol"], q.get("as_of"), q.get("last"), q.get("stale"), q.get("kept_previous"), q.get("error"))
          print("futures", m["chips"]["futures"])
          import collections
          print(collections.Counter(c["light"] for c in d["signals"]["chains"]))
          for c in d["signals"]["chains"]: print(c["id"], c["light"], c["basis"], c["why"])
          print(d["signals"]["backtest"])
          L = json.load(open("site/data/signal_log.json"))
          for e in L: print(e["date"], sum(len(c["prices"]) for c in e["chains"].values()), e["chains"]["memory"])
          PY
          python tools/rebuild_signal_log.py
          ls site/data/archive | wc -l
