<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投資情報小助手</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="assets.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>投資情報小助手</h1>
    <span id="updated" class="muted"></span>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="brief" role="tab">今日早報</button>
    <button class="tab" data-tab="world" role="tab">今天的世界</button>
    <button class="tab" data-tab="assets" role="tab">我的資產</button>
  </nav>
</header>

<div id="warnings"></div>
<section class="headline"><b>AI 一句話：</b><span id="headline">載入中…</span></section>

<main id="tab-brief" class="tabpane">
  <div class="grid brief-grid">
    <section class="card taiex">
      <div class="card-head"><h2>台股加權指數</h2><span id="taiex-date" class="muted"></span></div>
      <div class="big"><span id="taiex-last"></span><span id="taiex-chg"></span></div>
      <div class="periods" id="taiex-periods"></div>
      <div id="taiex-chart" class="chart"></div>
      <div class="range"><div class="range-bar"><span id="range-dot"></span></div>
        <div class="range-labels"><span id="range-lo"></span><span id="range-text"></span><span id="range-hi"></span></div></div>
    </section>

    <section class="card gauge-card">
      <div class="card-head"><h2>市場溫度計</h2><span class="muted">台股籌碼與全球風險指標</span></div>
      <div class="gauge-wrap">
        <div class="chips-panel">
          <div class="sub-head"><b>三大法人買賣超</b><span id="inst-date" class="muted"></span></div>
          <div id="inst" class="inst"></div>
          <div id="inst-hist" class="inst-hist"></div>
          <div id="margin" class="margin"></div>
          <ul id="chips-notes" class="chips-notes"></ul>
        </div>
        <div id="gauges" class="gauges"></div>
      </div>
    </section>

    <section class="card global-card">
      <div class="card-head"><h2>全球主要股市</h2><span class="muted">近 60 個交易日</span></div>
      <div id="global" class="minis"></div>
    </section>

    <section class="card ai-card">
      <div class="card-head"><h2>美國 AI 股</h2><span id="ai-bench" class="muted"></span></div>
      <div id="ai" class="stocks"></div>
    </section>

    <section class="card news-card">
      <div class="card-head"><h2>財經重點</h2><span class="muted">AI 整理，點標題看原文</span></div>
      <p id="comment" class="comment"></p>
      <ul id="points" class="points"></ul>
    </section>
  </div>
</main>

<main id="tab-world" class="tabpane" hidden>
  <div class="grid">
    <section class="card world">
      <div class="card-head"><h2>全球局勢</h2><span id="world-count" class="muted"></span></div>
      <p class="oneline"><b>局勢一句話</b><span id="world-headline">載入中…</span></p>
      <div id="world-map" class="worldmap"></div>
      <div id="region-chips" class="chips" role="tablist" aria-label="選擇地區"></div>
      <ul id="region-news" class="newslist"></ul>
    </section>

    <section class="card">
      <div class="card-head"><h2>AI 世界動態</h2><span class="muted">點標題看原文</span></div>
      <p class="oneline"><b>動態一句話</b><span id="ai-headline"></span></p>
      <ul id="ai-news" class="newslist"></ul>
    </section>
  </div>
</main>
<main id="tab-assets" class="tabpane" hidden>
  <section class="card placeholder">持股明細與分析在第三階段加入。</section>
</main>

<footer class="muted">資料來源：Yahoo Finance、臺灣證券交易所、各新聞 RSS。AI 整理僅供參考，不構成投資建議。<span id="model"></span></footer>
<script src="worldmap.js"></script>
<script src="app.js"></script>
<script src="assets.js" defer></script>
</body>
</html>
